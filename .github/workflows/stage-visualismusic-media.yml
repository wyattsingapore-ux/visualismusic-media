name: Stage VisualisMusic Instagram Media

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      run_date:
        description: Optional YYYY-MM-DD override; defaults to today in Asia/Singapore
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  issues: write

concurrency:
  group: visualismusic-media-${{ github.event_name == 'issues' && github.event.issue.number || inputs.run_date || 'manual' }}
  cancel-in-progress: false

jobs:
  stage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[VisualisMusic Stage]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: visualismusic-publisher
          workload_identity_provider: projects/223431871745/locations/global/workloadIdentityPools/github-publisher/providers/github
          service_account: visualismusic-media-stager@visualismusic-publisher.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Drive client dependencies
        run: python -m pip install 'google-auth>=2.35,<3' 'requests>=2.32,<3'

      - name: Download today's teaser from canonical Drive storage
        id: stage
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          MANUAL_DATE: ${{ inputs.run_date }}
        run: |
          mkdir -p /tmp/visualismusic-stage
          python - <<'PY'
          import csv, io, os, re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import google.auth
          from google.auth.transport.requests import AuthorizedSession

          CALENDAR_ID = "1s0T3EFdpIsMCOTVX5U01FcRx5-Qox542"
          VIDEO_FOLDER_ID = "1rmF_FUPLry0v2ArUC60I3ns0YdlUaHHE"
          FILES = "https://www.googleapis.com/drive/v3/files"
          scope = "https://www.googleapis.com/auth/drive.readonly"

          requested = (os.environ.get("MANUAL_DATE") or "").strip()
          if not requested:
              match = re.search(r"\b\d{4}-\d{2}-\d{2}\b", os.environ.get("ISSUE_TITLE", ""))
              requested = match.group(0) if match else datetime.now(ZoneInfo("Asia/Singapore")).date().isoformat()

          credentials, _ = google.auth.default(scopes=[scope])
          session = AuthorizedSession(credentials)
          response = session.get(f"{FILES}/{CALENDAR_ID}", params={"alt":"media","supportsAllDrives":"true"}, timeout=60)
          response.raise_for_status()
          rows = list(csv.DictReader(io.StringIO(response.text.lstrip("\ufeff"))))
          due = [row for row in rows if (row.get("date") or "").strip() == requested]
          if len(due) != 1:
              raise SystemExit(f"Expected exactly one scheduled row for {requested}, found {len(due)}")
          title = (due[0].get("title") or "").strip()
          slug = "".join(ch.lower() if ch.isalnum() else "_" for ch in title)
          while "__" in slug:
              slug = slug.replace("__", "_")
          slug = slug.strip("_")
          name = f"{slug}-teaser.mp4"
          escaped = name.replace("'", "\\'")
          params = {
              "q": f"'{VIDEO_FOLDER_ID}' in parents and name = '{escaped}' and trashed = false",
              "fields": "files(id,name,size)",
              "pageSize": "10",
              "supportsAllDrives": "true",
              "includeItemsFromAllDrives": "true",
          }
          found = session.get(FILES, params=params, timeout=60)
          found.raise_for_status()
          files = found.json().get("files", [])
          if len(files) != 1:
              raise SystemExit(f"Expected one Drive teaser named {name}, found {len(files)}")
          target = Path("/tmp/visualismusic-stage") / name
          media = session.get(f"{FILES}/{files[0]['id']}", params={"alt":"media","supportsAllDrives":"true"}, stream=True, timeout=1800)
          media.raise_for_status()
          with target.open("wb") as fh:
              for chunk in media.iter_content(1024*1024):
                  if chunk:
                      fh.write(chunk)
          if target.stat().st_size < 100_000:
              raise SystemExit(f"Downloaded teaser is implausibly small: {target.stat().st_size}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write(f"run_date={requested}\n")
              fh.write(f"filename={name}\n")
          print(f"Staged {name} for {requested} ({target.stat().st_size} bytes)")
          PY

      - name: Ensure public media release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view media >/dev/null 2>&1 || gh release create media --title "VisualisMusic media" --notes "Public media staging for platform APIs."

      - name: Upload teaser as public release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload media "/tmp/visualismusic-stage/${{ steps.stage.outputs.filename }}" --clobber

      - name: Verify public asset
        run: |
          url="https://github.com/${{ github.repository }}/releases/download/media/${{ steps.stage.outputs.filename }}"
          for attempt in {1..12}; do
            if curl -fsIL "$url" >/dev/null; then
              echo "Public media ready: $url"
              exit 0
            fi
            sleep 5
          done
          echo "Public media did not become reachable: $url" >&2
          exit 1

      - name: Comment on ChatGPT trigger
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "Media staging: **$RESULT**. Run: $RUN_URL"

      - name: Close successful trigger
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --reason completed
