name: VisualisMusic Stage Now

on:
  push:
    branches: [main]
    paths:
      - .github/visualismusic-stage-run-now

permissions:
  contents: write
  id-token: write

concurrency:
  group: visualismusic-stage-live
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google
        uses: google-github-actions/auth@v3
        with:
          project_id: visualismusic-publisher
          workload_identity_provider: projects/223431871745/locations/global/workloadIdentityPools/github-publisher/providers/github
          service_account: visualismusic-media-stager@visualismusic-publisher.iam.gserviceaccount.com
          create_credentials_file: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Drive client
        run: python -m pip install 'google-auth>=2.35,<3' 'requests>=2.32,<3'

      - name: Download existing Photograph teaser from Drive
        run: |
          python - <<'PY'
          from pathlib import Path
          import google.auth
          from google.auth.transport.requests import AuthorizedSession

          FOLDER = "1rmF_FUPLry0v2ArUC60I3ns0YdlUaHHE"
          NAME = "photograph-teaser.mp4"
          FILES = "https://www.googleapis.com/drive/v3/files"
          creds, _ = google.auth.default(scopes=["https://www.googleapis.com/auth/drive.readonly"])
          session = AuthorizedSession(creds)
          q = f"'{FOLDER}' in parents and name = '{NAME}' and trashed = false"
          r = session.get(FILES, params={"q": q, "fields": "files(id,name,size)", "pageSize": "10", "supportsAllDrives": "true", "includeItemsFromAllDrives": "true"}, timeout=60)
          r.raise_for_status()
          files = r.json().get("files", [])
          if len(files) != 1:
              raise SystemExit(f"Expected exactly one {NAME}, found {len(files)}")
          target = Path('/tmp') / NAME
          media = session.get(f"{FILES}/{files[0]['id']}", params={"alt": "media", "supportsAllDrives": "true"}, stream=True, timeout=1800)
          media.raise_for_status()
          with target.open('wb') as fh:
              for chunk in media.iter_content(1024 * 1024):
                  if chunk:
                      fh.write(chunk)
          if target.stat().st_size < 100000:
              raise SystemExit(f"Downloaded teaser too small: {target.stat().st_size}")
          print(f"Downloaded {NAME}: {target.stat().st_size} bytes")
          PY

      - name: Publish teaser as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view media >/dev/null 2>&1 || gh release create media --title "VisualisMusic media" --notes "Public media staging for platform APIs."
          gh release upload media /tmp/photograph-teaser.mp4 --clobber

      - name: Verify public teaser URL
        run: |
          url="https://github.com/${{ github.repository }}/releases/download/media/photograph-teaser.mp4"
          for attempt in {1..20}; do
            if curl -fsIL "$url" >/dev/null; then
              echo "PUBLIC_MEDIA_OK $url"
              exit 0
            fi
            sleep 3
          done
          echo "PUBLIC_MEDIA_FAILED $url" >&2
          exit 1

      - name: Record staging result
        if: always()
        run: |
          printf 'status=%s\nrun_id=%s\nupdated=%s\n' "${{ job.status }}" "${{ github.run_id }}" "$(date -u +%FT%TZ)" > .github/visualismusic-stage-last-result.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/visualismusic-stage-last-result.txt
          git commit -m "Record VisualisMusic staging result" || true
          git push || true
